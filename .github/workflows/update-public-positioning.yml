name: Update official public positioning
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/update_public_positioning.py
      - run: |
          if git diff --quiet -- public_data/public_positioning.csv; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data/public_positioning.csv
          git commit -m "Update official positioning data"
          git push
